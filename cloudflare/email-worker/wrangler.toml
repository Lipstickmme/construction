name = "axis-inbound-email"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# Where a copy of every message is forwarded. Must be a verified destination
# address in Cloudflare → Email → Email Routing → Destination addresses.
FORWARD_TO = "change-me@example.com"

# The site's inbound endpoint.
WEBHOOK_URL = "https://axisconstructionltd.com/api/inbound-email"

# INBOUND_SECRET is NOT set here — it is a secret, set with:
#   npx wrangler secret put INBOUND_SECRET
# and must match the INBOUND_SECRET environment variable in Vercel.
